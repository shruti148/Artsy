apiVersion: apps/v1
kind: Deployment
metadata:
  name: artsy-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: artsy-app
  template:
    metadata:
      labels:
        app: artsy-app
    spec:
      containers:
      - name: artsy-backend
        image: gcr.io/YOUR_PROJECT_ID/artsy-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: uri
        - name: ARTSY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: artsy-credentials
              key: client_id
        - name: ARTSY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: artsy-credentials
              key: client_secret
      - name: artsy-frontend
        image: gcr.io/YOUR_PROJECT_ID/artsy-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://localhost:3000/api"

---

apiVersion: v1
kind: Service
metadata:
  name: artsy-service
spec:
  type: LoadBalancer
  selector:
    app: artsy-app
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: api
    port: 3000
    targetPort: 3000
